name: Release

# Publishes to PyPI when a GitHub release is published.
# One-time setup: add this repository as a trusted publisher for the
# robotframework-snapshot project on PyPI (no API token needed), and create
# a GitHub environment named "pypi".

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
