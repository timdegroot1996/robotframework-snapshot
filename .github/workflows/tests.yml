name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        robotframework: ["6.1.1", "7.0.1", ""]
        include:
          - os: windows-latest
            python: "3.13"
            robotframework: ""
          - os: macos-latest
            python: "3.13"
            robotframework: ""
        exclude:
          # Robot Framework 6.1 and 7.0 predate Python 3.13
          - python: "3.13"
            robotframework: "6.1.1"
          - python: "3.13"
            robotframework: "7.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.robotframework }}" ]; then pip install "robotframework==${{ matrix.robotframework }}"; fi
          pip install -e ".[dev]"
      - name: Unit tests
        shell: bash
        run: bash scripts/python-tests.sh -q
      - name: Acceptance tests
        shell: bash
        run: bash scripts/robot-tests.sh
      - name: Upload acceptance test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atest-results-${{ matrix.os }}-py${{ matrix.python }}-rf${{ matrix.robotframework || 'latest' }}
          path: |
            results/*.xml
            results/*.html
      - name: Keyword documentation builds
        run: python -m robot.libdoc SnapshotLibrary docs/SnapshotLibrary.html
