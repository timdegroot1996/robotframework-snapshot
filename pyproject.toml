[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotframework-snapshot"
dynamic = ["version"]
description = "Snapshot testing for text and structured data in Robot Framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Tim de Groot" }]
keywords = ["robotframework", "testing", "snapshot", "approval testing", "golden file"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["robotframework>=6.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "robotframework-pabot>=4"]

[project.urls]
Homepage = "https://github.com/timdegroot1996/robotframework-snapshot"
Issues = "https://github.com/timdegroot1996/robotframework-snapshot/issues"

[tool.hatch.version]
path = "src/SnapshotLibrary/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/SnapshotLibrary"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/utest", "/atest/robot", "/atest/resources", "/atest/testdata", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["utest"]
